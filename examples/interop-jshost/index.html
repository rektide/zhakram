<!doctype html>
<meta charset="utf-8">
<title>p2-direct zena under jco, in the browser</title>
<script type="importmap">
{
  "imports": {
    "@bytecodealliance/preview2-shim/cli": "/node_modules/@bytecodealliance/preview2-shim/dist/browser/cli.js",
    "@bytecodealliance/preview2-shim/io": "/node_modules/@bytecodealliance/preview2-shim/dist/browser/io.js"
  }
}
</script>
<body>
<p id="status">loading…</p>
<script type="module">
  const el = document.getElementById('status');
  try {
    const m = await import('./p2-zena-out/p2-zena.component.js');
    const logs = [];
    const origLog = console.log;
    console.log = (...a) => { logs.push(a.join(' ')); origLog(...a); };
    m.run();
    console.log = origLog;
    const out = logs.join('\n');
    el.textContent = out.includes('hello p2')
      ? 'P2-ZENA-BROWSER-OK: ' + JSON.stringify(out)
      : 'P2-ZENA-BROWSER-PARTIAL: ran, stdout not captured: ' + JSON.stringify(out);
  } catch (e) {
    let detail;
    try { detail = JSON.stringify(e, Object.getOwnPropertyNames(e)); } catch { detail = String(e); }
    el.textContent = 'P2-ZENA-BROWSER-ERROR: ' + detail;
  }
  document.title = el.textContent;
</script>
</body>
